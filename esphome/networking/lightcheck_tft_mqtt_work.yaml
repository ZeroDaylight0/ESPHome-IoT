# Lightcheck TFT СЃ MQTT

esphome:
  name: lightcheck
  friendly_name: lightcheck

esp32:
  board: esp32dev

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

mqtt:
  broker: !secret mqtt_host
  username: !secret mqtt_username
  password: !secret mqtt_password
  port: 1883
  topic_prefix: tele/lightcheck

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO19

display:
  - platform: st7789v
    id: my_display
    model: TTGO TDisplay 135x240
    cs_pin: GPIO5
    dc_pin: GPIO16
    reset_pin: GPIO23
    backlight_pin: GPIO4
    rotation: 270В°
    lambda: |-
      it.fill(Color(0x00, 0x00, 0x00));

      it.print(120, 60, id(font_big),
               Color(0xFF, 0xFF, 0xFF),
               TextAlign::CENTER,
               "LightOn:");

      it.printf(120, 100, id(font_medium),
                Color(0x00, 0xFF, 0x88),
                TextAlign::CENTER,
                "%s", id(uptime_text).state.c_str());

font:
  - file: "gfonts://Roboto@700"
    id: font_big
    size: 32

  - file: "gfonts://Roboto"
    id: font_medium
    size: 28

text_sensor:
  - platform: template
    name: "Uptime Text"
    id: uptime_text
    update_interval: 5s
    lambda: |-
      uint32_t dur = millis() / 1000;
      int h = dur / 3600;
      int m = (dur % 3600) / 60;
      int s = dur % 60;

      char buf[32];
      if (h > 0) {
        snprintf(buf, sizeof(buf), "%d h %02d min %02d c", h, m, s);
      } else if (m > 0) {
        snprintf(buf, sizeof(buf), "%d min %02d c", m, s);
      } else {
        snprintf(buf, sizeof(buf), "%d sec", s);
      }
      return std::string(buf);

interval:
  - interval: 3s
    then:
      - component.update: my_display
