substitutions:
  device_name: esp-alert
  friendly_name: "ESP Alert Radar"

esphome:
  name: ${device_name}
  platform: ESP32
  board: esp32dev
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(alert_changed) = millis();
          id(auto_return_timer) = millis();

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_ap_password

captive_portal:

logger:
  level: INFO # Lowered to INFO so endless touch error spam does not hang the board

api:

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

mqtt:
  broker: !secret mqtt_host
  port: 1883
  id: mqtt_client
  topic_prefix: esphome/${device_name}
  on_message:
    - topic: esp/alert/status
      then:
        - lambda: |-
            if (x == "red" || x == "danger") {
              id(alert_status) = 3;
            } else if (x == "yellow" || x == "warn") {
              id(alert_status) = 2;
            } else if (x == "green" || x == "safe") {
              id(alert_status) = 1;
            } else {
              id(alert_status) = 0;
            }
            id(alert_changed) = millis();
    - topic: esp/alert/reason
      then:
        - lambda: |-
            id(alert_reason) = x;
    - topic: esp/alert/region
      then:
        - lambda: |-
            id(alert_region) = x;
    - topic: esp/weather/temp
      then:
        - lambda: |-
            id(cur_temp) = atof(x.c_str());
    - topic: esp/weather/humidity
      then:
        - lambda: |-
            id(cur_hum) = atoi(x.c_str());
    - topic: esp/weather/desc
      then:
        - lambda: |-
            id(weather_desc) = x;

# SPI for the display and touchscreen
spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12

# Fixed XPT2046 touchscreen configuration for the CYD
touchscreen:
  - platform: xpt2046
    id: my_touchscreen
    cs_pin: GPIO33
    interrupt_pin: GPIO36 # The interrupt stops endless false touch spam
    update_interval: 30ms
    threshold: 600       # Sensor debounce
    swap_x_y: true       # Axes adapted for landscape mode
    invert_x: false
    invert_y: true
    on_touch:
      - lambda: |-
          // Ignore garbage 0,0 coordinates
          if (touch.x <= 5 && touch.y <= 5) return;

          ESP_LOGI("touch", "Touch: X=%d, Y=%d", touch.x, touch.y);

          // Check for a hit on the bottom button row (Y from 190 to 235)
          if (touch.y >= 190 && touch.y <= 235) {
            // LEFT BUTTON (X from 15 to 145): switch between Radar and Weather screens
            if (touch.x >= 15 && touch.x <= 145) {
              id(current_page) = (id(current_page) == 0) ? 1 : 0;
              id(auto_return_timer) = millis();
              ESP_LOGI("touch", "PAGE button pressed");
            }
            // RIGHT BUTTON (X from 175 to 305): send MQTT CALL
            else if (touch.x >= 175 && touch.x <= 305) {
              id(mqtt_client).publish("esp/zvonok", "call");
              ESP_LOGI("touch", "CALL button pressed");
            }
          }

# ILI9341 320x240 display
display:
  - platform: ili9xxx
    model: ili9341
    cs_pin: GPIO15
    dc_pin: GPIO2
    rotation: 90
    dimensions:
      width: 320
      height: 240
    invert_colors: false
    update_interval: 500ms # Refresh more often for a responsive UI
    lambda: |-
      // Clear the whole screen to black before every render
      it.fill(Color::BLACK);

      int status = id(alert_status);
      unsigned long time_since = (millis() - id(alert_changed)) / 1000;

      // Pick the UI color based on the threat level
      Color status_color;
      const char* status_text;

      if (status == 3) {
        status_color = Color(0xFF, 0x22, 0x22); // Bright red
        status_text = "ALERT";
      } else if (status == 2) {
        status_color = Color(0xFF, 0x99, 0x00); // Orange
        status_text = "WARNING";
      } else if (status == 1) {
        status_color = Color(0x00, 0xCC, 0x44); // Green
        status_text = "SAFE";
      } else {
        status_color = Color(0x77, 0x77, 0x77); // Gray
        status_text = "NO DATA";
      }

      // ==========================================
      // PAGE 0: MAIN RADAR SCREEN
      // ==========================================
      if (id(current_page) == 0) {

        // Background radar grid (muted status color)
        Color grid_color = Color(status_color.red / 4, status_color.green / 4, status_color.blue / 4);
        it.circle(160, -20, 140, grid_color);
        it.circle(160, -20, 200, grid_color);

        // Large status centered at the top
        it.printf(160, 25, id(font_huge), status_color, TextAlign::CENTER, "%s", status_text);

        // Region and reason block (no overlapping)
        if (status >= 2 && !id(alert_reason).empty()) {
          // Active threat: large region, with the reason on its own line below
          it.printf(160, 75, id(font_large), Color::WHITE, TextAlign::CENTER, "%s", id(alert_region).c_str());
          it.printf(160, 110, id(font_medium), status_color, TextAlign::CENTER, "[ %s ]", id(alert_reason).c_str());
        } else {
          // All clear: just show the region centered
          it.printf(160, 85, id(font_large), Color(0xBB, 0xBB, 0xBB), TextAlign::CENTER, "%s", id(alert_region).c_str());
        }

        // Status activity timer above the buttons
        char time_buf[64];
        if (time_since < 3600) {
          snprintf(time_buf, sizeof(time_buf), "Active for: %lum %lus", time_since / 60, time_since % 60);
        } else {
          snprintf(time_buf, sizeof(time_buf), "Active for: %lu hours", time_since / 3600);
        }
        it.printf(160, 165, id(font_tiny), Color(0x66, 0x66, 0x66), TextAlign::CENTER, "%s", time_buf);
      }

      // ==========================================
      // PAGE 1: WEATHER SCREEN
      // ==========================================
      else if (id(current_page) == 1) {
        // Screen header
        it.printf(160, 20, id(font_large), Color(0x44, 0xAA, 0xFF), TextAlign::CENTER, "WEATHER FORECAST");

        if (id(cur_temp) > -50) {
          // Large temperature
          it.printf(160, 55, id(font_xlarge), Color::WHITE, TextAlign::CENTER, "%.1f°C", id(cur_temp));
          // Humidity
          it.printf(160, 110, id(font_medium), Color(0xBB, 0xBB, 0xBB), TextAlign::CENTER, "Humidity: %d%%", id(cur_hum));
          // Text description (Cloudy, Overcast, etc.)
          it.printf(160, 140, id(font_medium), status_color, TextAlign::CENTER, "%s", id(weather_desc).c_str());
        } else {
          it.printf(160, 90, id(font_medium), Color(0x66, 0x66, 0x66), TextAlign::CENTER, "No data from MQTT...");
        }
      }

      // ==========================================
      // BOTTOM BUTTONS (strict scale, X within 0-320, Y within 0-240)
      // ==========================================

      // LEFT BUTTON (tabs): X 15->145, Y 195->230 (width 130, height 35)
      it.filled_rectangle(15, 195, 130, 35, Color(0x11, 0x25, 0x33));
      it.rectangle(15, 195, 130, 35, Color(0x33, 0x77, 0xAA));

      if (id(current_page) == 0) {
        it.printf(80, 212, id(font_button), Color(0x55, 0xCC, 0xFF), TextAlign::CENTER, "SEE WEATHER");
      } else {
        it.printf(80, 212, id(font_button), Color(0x55, 0xCC, 0xFF), TextAlign::CENTER, "SEE RADAR");
      }

      // RIGHT BUTTON (CALL): X 175->305, Y 195->230 (width 130, height 35)
      it.filled_rectangle(175, 195, 130, 35, Color(0x33, 0x1A, 0x00));
      it.rectangle(175, 195, 130, 35, Color(0xAA, 0x66, 0x00));
      it.printf(240, 212, id(font_button), Color(0xFF, 0xAA, 0x22), TextAlign::CENTER, "CALL");

# Backlight control
output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 500ms

# Optimized Roboto fonts
font:
  - file:
      type: gfonts
      family: Roboto
      weight: 900
    id: font_huge
    size: 38

  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: font_xlarge
    size: 34

  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: font_large
    size: 24

  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_medium
    size: 18

  - platform: gfonts
    file: Roboto
    weight: 700
    id: font_button
    size: 14 # Reduced so long text always fits inside the buttons

  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_tiny
    size: 12

# Auto-return to the main screen
interval:
  - interval: 1s
    then:
      - lambda: |-
          // If the weather page is open and untouched for over 15 seconds, go back to the radar
          if (id(current_page) != 0 && (millis() - id(auto_return_timer) > 15000)) {
            id(current_page) = 0;
          }

# System globals
globals:
  - id: alert_status
    type: int
    restore_value: no
    initial_value: '1'
  - id: alert_reason
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: alert_region
    type: std::string
    restore_value: no
    initial_value: '"Kyiv"'
  - id: alert_changed
    type: unsigned long
    restore_value: no
    initial_value: '0'

  # Page variable: 0 = Radar, 1 = Weather
  - id: current_page
    type: int
    restore_value: no
    initial_value: '0'

  # Weather data
  - id: cur_temp
    type: float
    restore_value: no
    initial_value: '-99'
  - id: cur_hum
    type: int
    restore_value: no
    initial_value: '0'
  - id: weather_desc
    type: std::string
    restore_value: no
    initial_value: '"Loading..."'
  - id: auto_return_timer
    type: unsigned long
    restore_value: no
    initial_value: '0'

# System binary sensors
binary_sensor:
  - platform: status
    name: "Status"
    id: device_status

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    update_interval: 60s
