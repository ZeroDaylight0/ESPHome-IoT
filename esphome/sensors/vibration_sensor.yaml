esphome:
  name: vibration-sensor
  friendly_name: Vibration Sensor
  platformio_options:
    board_build.mcu: esp32c3
    board_build.variant: esp32c3
  platform: ESP32
  board: esp32-c3-devkitm-1

logger:
  level: DEBUG
  logs:
    vibration: DEBUG

api:

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password


  ap:
    ssid: "Vibration-Sensor"
    password: !secret fallback_ap_password

i2c:
  sda: GPIO5
  scl: GPIO6
  scan: true
  id: bus_a

web_server:
  port: 80

mqtt:
  broker: !secret mqtt_host
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  discovery_prefix: homeassistant
  topic_prefix: vibration_sensor

font:
  - file: "6320-font.ttf"
    id: font_small
    size: 10
  - file: "6320-font.ttf"
    id: font_huge
    size: 28

display:
  - platform: ssd1306_i2c
    model: "SH1106 128x64"
    address: 0x3C
    update_interval: 100ms
    id: oled_display
    lambda: |-
      static bool show_ip = true;
      static uint32_t boot_time = millis();

      // Show IP for first 5 seconds
      if (show_ip && (millis() - boot_time < 5000)) {
        it.printf(64, 20, id(font_small), TextAlign::CENTER, "IP:");
        it.printf(64, 35, id(font_small), TextAlign::CENTER, "%s", id(wifi_ip).state.c_str());
        return;
      } else {
        show_ip = false;
      }

      // Only numbers - vibration intensity
      float intensity = id(vibration_intensity).state;

      // Big intensity value
      it.printf(64, 2, id(font_huge), TextAlign::TOP_CENTER, "%.0f", intensity);

      // Count and rate below
      it.printf(32, 38, id(font_small), TextAlign::CENTER, "%.0f", id(vibration_counter).state);
      it.printf(96, 38, id(font_small), TextAlign::CENTER, "%.0f", id(vibration_rate).state);

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
    name: "Vibration Detected"
    id: vibration_binary
    device_class: vibration
    filters:
      - delayed_off: 100ms
    on_press:
      then:
        - logger.log: "Vibration detected!"
        - sensor.template.publish:
            id: vibration_counter
            state: !lambda 'return id(vibration_counter).state + 1;'
        - sensor.template.publish:
            id: vibration_intensity
            state: 100.0
    on_release:
      then:
        - sensor.template.publish:
            id: vibration_intensity
            state: 0.0

sensor:
  - platform: template
    name: "Vibration Count"
    id: vibration_counter
    icon: "mdi:counter"
    unit_of_measurement: "events"
    state_class: total_increasing
    accuracy_decimals: 0
    lambda: |-
      static int count = 0;
      return count;
  - platform: template
    name: "Vibration Intensity"
    id: vibration_intensity
    icon: "mdi:wave"
    unit_of_measurement: "units"
    state_class: measurement
    update_interval: 1s
    lambda: |-
      static float current_value = 0;
      static uint32_t last_vibration = 0;


      if (id(vibration_binary).state) {
        current_value = 100.0;
        last_vibration = millis();
      } else {

        uint32_t time_since = millis() - last_vibration;
        if (time_since < 30000) {
          current_value = 1000.0 * (1.0 - (float)time_since / 30000.0);
        } else {
          current_value = 0;
        }
      }

      ESP_LOGD("vibration", "Intensity: %.1f units", current_value);
      return current_value;
  - platform: template
    name: "Vibration Events per Minute"
    id: vibration_rate
    icon: "mdi:chart-line"
    unit_of_measurement: "events/min"
    state_class: measurement
    update_interval: 5s
    lambda: |-
      static std::vector<uint32_t> event_times;
      uint32_t now = millis();


      if (id(vibration_binary).state) {
        event_times.push_back(now);
      }


      event_times.erase(
        std::remove_if(event_times.begin(), event_times.end(),
          [now](uint32_t t) { return (now - t) > 60000; }),
        event_times.end()
      );

      return event_times.size();
  - platform: template
    name: "Last Vibration Time"
    id: last_vibration_time
    icon: "mdi:clock-outline"
    unit_of_measurement: "s"
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      static uint32_t last_time = 0;
      if (id(vibration_binary).state) {
        last_time = millis();
      }
      return last_time / 1000.0;
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
text_sensor:
  - platform: template
    name: "Vibration Event Type"
    id: event_type
    icon: "mdi:information-outline"
    lambda: |-
      float rate = id(vibration_rate).state;
      if (rate > 30) {
        return {"Critical - Possible Explosion"};
      } else if (rate > 15) {
        return {"High - Strong Shaking"};
      } else if (rate > 5) {
        return {"Medium - Moderate Activity"};
      } else if (rate > 0) {
        return {"Low - Minor Vibration"};
      } else {
        return {"Idle"};
      }
    update_interval: 2s
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip
light:
  - platform: status_led
    name: "Status LED"
    pin: GPIO8
button:
  - platform: template
    name: "Reset Vibration Counter"
    icon: "mdi:restart"
    on_press:
      - sensor.template.publish:
          id: vibration_counter
          state: 0
