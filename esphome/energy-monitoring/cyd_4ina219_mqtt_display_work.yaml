# CYD BMS 4S СЃ INA219 Рё РѕС‚РѕР±СЂР°Р¶РµРЅРёРµРј С‡РµСЂРµР· MQTT

esphome:
  name: cyd-ina-display
  friendly_name: "CYD BMS 4S INA219"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

mqtt:
  broker: !secret mqtt_host
  username: !secret mqtt_username
  password: !secret mqtt_password

text_sensor:
  - platform: mqtt_subscribe
    id: raw_v1_str
    topic: esphome/4ina219_monitor/cell1_voltage/state

  - platform: mqtt_subscribe
    id: raw_i1_str
    topic: esphome/4ina219_monitor/cell1_current/state

  - platform: mqtt_subscribe
    id: raw_v2_str
    topic: esphome/4ina219_monitor/cell2_voltage/state

  - platform: mqtt_subscribe
    id: raw_i2_str
    topic: esphome/4ina219_monitor/cell2_current/state

  - platform: mqtt_subscribe
    id: raw_v3_str
    topic: esphome/4ina219_monitor/cell3_voltage/state

  - platform: mqtt_subscribe
    id: raw_i3_str
    topic: esphome/4ina219_monitor/cell3_current/state

  - platform: mqtt_subscribe
    id: raw_v4_str
    topic: esphome/4ina219_monitor/cell4_voltage/state

  - platform: mqtt_subscribe
    id: raw_i4_str
    topic: esphome/4ina219_monitor/cell4_current/state

sensor:
  - platform: template
    name: "Cell1_voltage"
    id: cell1_v
    unit_of_measurement: "V"
    accuracy_decimals: 3
    lambda: |-
      if (id(raw_v1_str).has_state() && !id(raw_v1_str).state.empty()) {
        return atof(id(raw_v1_str).state.c_str());
      }
      return NAN;

  - platform: template
    name: "Cell2_voltage"
    id: cell2_v
    unit_of_measurement: "V"
    accuracy_decimals: 3
    lambda: |-
      if (id(raw_v1_str).has_state() && id(raw_v2_str).has_state() &&
          !id(raw_v1_str).state.empty() && !id(raw_v2_str).state.empty()) {
        return atof(id(raw_v2_str).state.c_str()) - atof(id(raw_v1_str).state.c_str());
      }
      return NAN;

  - platform: template
    name: "Cell3_voltage"
    id: cell3_v
    unit_of_measurement: "V"
    accuracy_decimals: 3
    lambda: |-
      if (id(raw_v2_str).has_state() && id(raw_v3_str).has_state() &&
          !id(raw_v2_str).state.empty() && !id(raw_v3_str).state.empty()) {
        return atof(id(raw_v3_str).state.c_str()) - atof(id(raw_v2_str).state.c_str());
      }
      return NAN;

  - platform: template
    name: "Cell4_voltage"
    id: cell4_v
    unit_of_measurement: "V"
    accuracy_decimals: 3
    lambda: |-
      if (id(raw_v3_str).has_state() && id(raw_v4_str).has_state() &&
          !id(raw_v3_str).state.empty() && !id(raw_v4_str).state.empty()) {
        return atof(id(raw_v4_str).state.c_str()) - atof(id(raw_v3_str).state.c_str());
      }
      return NAN;

  - platform: template
    name: "TotalVoltage"
    id: total_v
    unit_of_measurement: "V"
    accuracy_decimals: 3
    lambda: |-
      if (id(raw_v4_str).has_state() && !id(raw_v4_str).state.empty()) {
        return atof(id(raw_v4_str).state.c_str());
      }
      return NAN;

font:
  - file: "gfonts://Roboto"
    id: font_big
    size: 26
  - file: "gfonts://Roboto"
    id: font_small
    size: 20

output:
  - platform: ledc
    pin: GPIO21
    id: tft_backlight
    frequency: 1000 Hz
    inverted: false

light:
  - platform: monochromatic
    name: "Display Brightness"
    output: tft_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

display:
  - platform: ili9xxx
    model: ILI9341
    cs_pin: GPIO15
    dc_pin: GPIO2
    invert_colors: false
    rotation: 90
    update_interval: 5s
    lambda: |-
      it.fill(Color::BLACK);

      it.print(10, 5, id(font_big), Color::WHITE, TextAlign::TOP_LEFT, "BMS 4S");

      char buf[32];

      if (!std::isnan(id(cell1_v).state) && id(raw_i1_str).has_state() && !id(raw_i1_str).state.empty()) {
        snprintf(buf, sizeof(buf), "РЇС‡1: %.3fV  %.3fA", id(cell1_v).state, atof(id(raw_i1_str).state.c_str()));
        it.print(10, 45, id(font_small), Color(0, 255, 0), TextAlign::TOP_LEFT, buf);
      } else {
        it.print(10, 45, id(font_small), Color(255, 0, 0), TextAlign::TOP_LEFT, "C1: ---V  ---A");
      }

      if (!std::isnan(id(cell2_v).state) && id(raw_i2_str).has_state() && !id(raw_i2_str).state.empty()) {
        snprintf(buf, sizeof(buf), "РЇС‡2: %.3fV  %.3fA", id(cell2_v).state, atof(id(raw_i2_str).state.c_str()));
        it.print(10, 75, id(font_small), Color(0, 255, 0), TextAlign::TOP_LEFT, buf);
      } else {
        it.print(10, 75, id(font_small), Color(255, 0, 0), TextAlign::TOP_LEFT, "C2: ---V  ---A");
      }

      if (!std::isnan(id(cell3_v).state) && id(raw_i3_str).has_state() && !id(raw_i3_str).state.empty()) {
        snprintf(buf, sizeof(buf), "РЇС‡3: %.3fV  %.3fA", id(cell3_v).state, atof(id(raw_i3_str).state.c_str()));
        it.print(10, 105, id(font_small), Color(0, 255, 0), TextAlign::TOP_LEFT, buf);
      } else {
        it.print(10, 105, id(font_small), Color(255, 0, 0), TextAlign::TOP_LEFT, "C3: ---V  ---A");
      }

      if (!std::isnan(id(cell4_v).state) && id(raw_i4_str).has_state() && !id(raw_i4_str).state.empty()) {
        snprintf(buf, sizeof(buf), "РЇС‡4: %.3fV  %.3fA", id(cell4_v).state, atof(id(raw_i4_str).state.c_str()));
        it.print(10, 135, id(font_small), Color(0, 255, 0), TextAlign::TOP_LEFT, buf);
      } else {
        it.print(10, 135, id(font_small), Color(255, 0, 0), TextAlign::TOP_LEFT, "C4: ---V  ---A");
      }

      if (!std::isnan(id(total_v).state)) {
        snprintf(buf, sizeof(buf), "Total: %.3fV", id(total_v).state);
        it.print(10, 180, id(font_big), Color(255, 255, 0), TextAlign::TOP_LEFT, buf);
      } else {
        it.print(10, 180, id(font_big), Color(255, 0, 0), TextAlign::TOP_LEFT, "Total: ---V");
      }

spi:
  - id: tft_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12

api:
web_server:
  port: 80
  version: 3
  local: true

ota:
  platform: esphome
  password: !secret fallback_ap_password
